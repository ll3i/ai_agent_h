# 분류 판단 기준 
1. 👻 유령형 (Missing): 부품 유실
특징: 기판 구멍만 보이고 소자가 없음.
파일명,상세 불량 사유 (Ground Truth)
TEST_091,소자 전체 유실 (Empty).
TEST_034,소자 전체 유실.

2. 🗡️ 연결형 (Connectivity): 절단(Cut) & 미삽(Miss) & 합선(Short)
특징: 다리가 짧거나, 구멍 밖으로 나오거나, 서로 닿음. (가장 중요)
파일명,상세 불량 사유 (Ground Truth)
TEST_014,"[수정됨] [우측 미삽/절단] 몸체 파손도 있지만, 핵심은 오른쪽 다리가 기판에 연결되지 않음."(3번 다리)
TEST_099,[행 이탈/절단] 왼쪽/가운데 다리가 짧게 잘림. 소자가 정해진 구멍 라인(Row)을 벗어남.(1,2번 다리)
TEST_092,[비틀림/미삽] 가운데 다리가 뒤틀려 구멍에 안 들어감. 다리 간격 불량.(2번 다리)
TEST_085,[가운데 미삽] 가운데 다리 끝(Tip)이 구멍 밖으로 삐져나옴.(2번 다리)
TEST_077,[우측 미삽] 오른쪽 다리가 구멍에 안 들어가고 기판 위에 얹혀 있음.(3번 다리)
TEST_066,[좌측 절단] 왼쪽 다리가 중간에 끊겨 짧음.(1번 다리)
TEST_079,[좌측 침범] 왼쪽 다리가 휘어 가운데 구멍 영역을 침범.(1번 다리)
TEST_057,[가운데 미삽] 가운데 다리가 구멍 위를 지나쳐 허공에 뜸.(2번 다리)
TEST_055,[합선] 다리 3개가 같은 라인에 꽂혀 합선(Short). (소자 누움 포함)
TEST_001,[가운데 절단] 가운데 다리가 짧게 잘림.(2번 다리)
TEST_006,[우측 절단] 오른쪽 다리 끝부분 유실.(3번 다리)
TEST_015,[가운데 절단] 가운데 다리가 중간에서 끊김.(2번 다리)
TEST_022,[좌측 절단] 왼쪽 다리가 짧게 잘림.(1번 다리)
TEST_029,[우측 절단] 오른쪽 다리 길이가 짧음.(3번 다리)
TEST_031,[우측 절단] 오른쪽 다리가 짧아 구멍에 안 닿음.(3번 다리)
TEST_038,[좌측 절단] 왼쪽 다리가 끊겨 허공에 뜸.(1번 다리)
TEST_095,[좌측 절단] 왼쪽 다리가 짧게 끊김.(1번 다리)
TEST_081,[우측 절단] 오른쪽 다리가 발목 잘리듯 짧게 잘림.(3번 다리)
TEST_086,[우측 절단] 오른쪽 다리 끝부분 유실.(3번 다리)
TEST_009,[전체 미삽] 다리 3개가 구멍에 안 들어가고 기판 위에 얹힘.(다리 전부)
TEST_011,[우측 미삽] 오른쪽 다리가 구멍 밖으로 빠져나옴.(3번 다리)
TEST_026,[전체 미삽] 다리들이 구멍 위치를 벗어나 밖으로 뻗음.(다리 전부)
TEST_074,[벌어짐] 다리가 심하게 벌어져 구멍 위치 이탈.(1,3번 다리)

3. 💥 파손형 (Broken): 몸체 깨짐 (심각한 경우만)
특징: 내부 칩이 보일 정도로 심하게 박살난 경우.
파일명,상세 불량 사유 (Ground Truth)
TEST_094,[박살] 몸체 상단 절반이 날아가 내부가 훤히 보임.
TEST_098,[파손] 몸체 윗부분이 사선으로 크게 떨어져 나감.
TEST_030,[파손] 몸체 윗부분이 심하게 깨져 내부 프레임 노출.

4. 🤸 곡예형 (Posture): 자세 불량
특징: 눕거나 뒤집힘
파일명,상세 불량 사유 (Ground Truth)
TEST_093,[누움] 소자가 기판 바닥에 옆으로 누워 있음.(다리 전부)
TEST_069,[역삽] 다리가 하늘을 향하고 몸체가 아래에 있음 (뒤집힘).

5. 🌀 회전형 (Alignment): 정렬 불량
특징: 45도 이상 회전
파일명,상세 불량 사유 (Ground Truth)
TEST_053,[회전] 소자가 마름모꼴로 45도 이상 회전.(+다리 전부 연결 X)
TEST_063,[회전/꼬임] 삐딱하게 돌아가고 다리가 꼬임.(1번 다리)
TEST_088,[회전/휨] 회전으로 인해 다리가 휘어 정위치 삽입 불가.(다리 전부)

6. 정상 분류 (Normal & Noisy Normal)
특징: 흠집, 파손이 있어도 기능(연결)에 문제없으면 정상으로 간주. (사용자 피드백 반영 완료)
파일명,상태 설명 (Reasoning)
TEST_023,"[정상] 몸체 상단 찍힘이 있으나, 내부 칩 노출 없음. 연결 양호."
TEST_044,"[정상] 모서리 파손이 있으나, 치명적이지 않음. 연결 양호."
TEST_039,[정상] 표면 스크래치 및 거친 마감. 기능 정상.
TEST_024,[정상] 표면 스크래치. 기능 정상.
그 외,"TEST_012(들뜸), TEST_018(미세 휨) 등 나머지 파일들."